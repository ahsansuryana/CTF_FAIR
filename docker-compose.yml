services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctffair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ctffair}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ctf-app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctffair}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  backend:
    image: ghcr.io/ahsansuryana/ctf-fair-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ctffair}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ctffair}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-256-bit-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-to-another-random-256-bit-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # CLIENT_URL is not needed — served same-origin via nginx proxy
      PRISMA_ENGINE_PROTOCOL: ${PRISMA_ENGINE_PROTOCOL:-json}
      DOMAIN: ${DOMAIN:-localhost}
      UPLOAD_DIR: /app/uploads
      DOCKER_NETWORK: ${DOCKER_NETWORK:-ctf_fair_ctf-challenges-net}
      DOCKER_INSTANCE_DEFAULT_TTL: ${DOCKER_INSTANCE_DEFAULT_TTL:-3600}
      DOCKER_INSTANCE_PORT_RANGE_START: ${DOCKER_INSTANCE_PORT_RANGE_START:-10000}
      DOCKER_INSTANCE_PORT_RANGE_END: ${DOCKER_INSTANCE_PORT_RANGE_END:-20000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - challenge-files:/app/uploads
    networks:
      - ctf-app-net
      - ctf-challenges-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    image: ghcr.io/ahsansuryana/ctf-fair-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - ctf-app-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - ctf-app-net
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

networks:
  ctf-app-net:
    driver: bridge
  ctf-challenges-net:
    driver: bridge
    internal: false

volumes:
  postgres-data:
  challenge-files:
